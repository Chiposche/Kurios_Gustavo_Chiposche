      <stop offset="0%" style="stop-color:#0a1a3a"/>
      <stop offset="100%" style="stop-color:#1a0a2a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Head -->
  <ellipse cx="200" cy="210" rx="118" ry="128" fill="#6a5838"/>

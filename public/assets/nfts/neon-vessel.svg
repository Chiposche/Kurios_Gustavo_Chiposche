  <ellipse cx="92" cy="205" rx="23" ry="28" fill="#6a5838"/>
  <ellipse cx="92" cy="205" rx="14" ry="18" fill="#B09060"/>
  <ellipse cx="308" cy="205" rx="23" ry="28" fill="#6a5838"/>
  <ellipse cx="308" cy="205" rx="14" ry="18" fill="#B09060"/>
  <!-- Hoodie -->

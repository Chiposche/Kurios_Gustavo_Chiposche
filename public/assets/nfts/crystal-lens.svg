  <ellipse cx="235" cy="205" rx="20" ry="18" fill="white"/>
  <circle cx="165" cy="205" r="10" fill="#0D47A1"/>
  <circle cx="235" cy="205" r="10" fill="#0D47A1"/>
  <circle cx="162" cy="202" r="4" fill="white"/>
  <circle cx="232" cy="202" r="4" fill="white"/>
  <circle cx="170" cy="198" r="2" fill="white"/>
  <circle cx="240" cy="198" r="2" fill="white"/>
  <!-- Nose -->
  <ellipse cx="200" cy="248" rx="14" ry="9" fill="#6a8aAA"/>

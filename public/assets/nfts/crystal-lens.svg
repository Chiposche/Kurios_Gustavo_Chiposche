  <ellipse cx="200" cy="235" rx="82" ry="86" fill="#90CAF9"/>
  <!-- Camera around neck -->
  <rect x="160" y="300" width="80" height="50" rx="8" fill="#37474F"/>
  <circle cx="200" cy="320" r="16" fill="#263238"/>
  <circle cx="200" cy="320" r="12" fill="#4FC3F7" opacity="0.3"/>
  <circle cx="200" cy="320" r="6" fill="#0288D1"/>
  <rect x="222" y="305" width="12" height="8" rx="2" fill="#546E7A"/>

  <circle cx="206" cy="248" r="3" fill="#4a6a8a"/>
  <!-- Gentle smile -->
  <path d="M182 272 Q200 284 218 272" stroke="#4a6a8a" stroke-width="2.5" fill="none"/>
  <!-- Ears -->
  <ellipse cx="94" cy="210" rx="22" ry="27" fill="#4a6a8a"/>

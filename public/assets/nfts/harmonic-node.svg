<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2810"/>
      <stop offset="100%" style="stop-color:#2a3818"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Sound wave circles -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="#AED581" stroke-width="1" opacity="0.08"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="#AED581" stroke-width="1" opacity="0.1"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="#AED581" stroke-width="1" opacity="0.12"/>
  <!-- Head -->
  <ellipse cx="200" cy="215" rx="116" ry="126" fill="#4a6a28"/>
  <ellipse cx="200" cy="235" rx="82" ry="86" fill="#AED581"/>
  <!-- Oversized headphones -->
  <path d="M112 185 Q112 120 200 110 Q288 120 288 185" stroke="#33691E" stroke-width="6" fill="none"/>
  <ellipse cx="108" cy="195" rx="18" ry="28" fill="#33691E"/>
  <ellipse cx="108" cy="195" rx="12" ry="22" fill="#558B2F"/>
  <ellipse cx="292" cy="195" rx="18" ry="28" fill="#33691E"/>
  <ellipse cx="292" cy="195" rx="12" ry="22" fill="#558B2F"/>
  <!-- Equalizer on left ear -->
  <rect x="101" y="185" width="3" height="8" fill="#AED581" opacity="0.6"/>
  <rect x="106" y="181" width="3" height="16" fill="#AED581" opacity="0.6"/>
  <rect x="111" y="183" width="3" height="12" fill="#AED581" opacity="0.6"/>
  <!-- Happy eyes -->
  <ellipse cx="165" cy="205" rx="18" ry="16" fill="white"/>
  <ellipse cx="235" cy="205" rx="18" ry="16" fill="white"/>
  <circle cx="168" cy="205" r="9" fill="#1B5E20"/>
  <circle cx="238" cy="205" r="9" fill="#1B5E20"/>
  <circle cx="166" cy="202" r="4" fill="white"/>
  <circle cx="236" cy="202" r="4" fill="white"/>
  <!-- Nose -->
  <ellipse cx="200" cy="245" rx="13" ry="8" fill="#7a9a58"/>
  <circle cx="194" cy="245" r="3" fill="#5a7a38"/>
  <circle cx="206" cy="245" r="3" fill="#5a7a38"/>
  <!-- Wide grin -->
  <path d="M168 270 Q200 298 232 270" stroke="#5a7a38" stroke-width="2.5" fill="none"/>
  <path d="M175 270 Q200 290 225 270" fill="#5a7a38"/>

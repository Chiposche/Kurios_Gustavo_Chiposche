  <ellipse cx="94" cy="220" rx="16" ry="22" fill="#4a6a28"/>
  <ellipse cx="94" cy="220" rx="9" ry="14" fill="#AED581"/>
  <ellipse cx="306" cy="220" rx="16" ry="22" fill="#4a6a28"/>
  <ellipse cx="306" cy="220" rx="9" ry="14" fill="#AED581"/>
  <!-- Music producer jacket -->
  <path d="M112 315 Q200 340 288 315 L298 400 L102 400 Z" fill="#33691E"/>
  <!-- Zipper -->
  <line x1="200" y1="320" x2="200" y2="400" stroke="#AED581" stroke-width="2" opacity="0.4"/>
  <!-- Head top -->
  <path d="M135 132 Q165 108 200 114 Q235 108 265 132" fill="#4a6a28"/>

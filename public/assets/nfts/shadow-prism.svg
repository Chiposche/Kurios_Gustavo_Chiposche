<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#1a0a1a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Prism refractions -->
  <polygon points="200,50 160,120 240,120" fill="none" stroke="#E040FB" stroke-width="1" opacity="0.2"/>
  <line x1="160" y1="120" x2="80" y2="180" stroke="#F44336" stroke-width="1" opacity="0.15"/>
  <line x1="200" y1="120" x2="200" y2="180" stroke="#4CAF50" stroke-width="1" opacity="0.15"/>
  <line x1="240" y1="120" x2="320" y2="180" stroke="#2196F3" stroke-width="1" opacity="0.15"/>
  <!-- Head -->
  <ellipse cx="200" cy="215" rx="116" ry="126" fill="#2a1a2a"/>
  <ellipse cx="200" cy="235" rx="82" ry="86" fill="#4a3a4a"/>
  <!-- Glowing eyes -->
  <ellipse cx="165" cy="205" rx="20" ry="18" fill="#1a0a1a"/>
  <ellipse cx="235" cy="205" rx="20" ry="18" fill="#1a0a1a"/>
  <circle cx="165" cy="205" r="8" fill="#F44336"/>
  <circle cx="235" cy="205" r="8" fill="#F44336"/>
  <circle cx="165" cy="205" r="4" fill="#FF8A80" opacity="0.8"/>
  <circle cx="235" cy="205" r="4" fill="#FF8A80" opacity="0.8"/>
  <!-- Shadow around eyes -->
  <ellipse cx="165" cy="205" rx="24" ry="22" fill="none" stroke="#F44336" stroke-width="1" opacity="0.3"/>
  <ellipse cx="235" cy="205" rx="24" ry="22" fill="none" stroke="#F44336" stroke-width="1" opacity="0.3"/>
  <!-- Nose -->
  <ellipse cx="200" cy="248" rx="14" ry="9" fill="#3a2a3a"/>
  <circle cx="194" cy="248" r="3" fill="#2a1a2a"/>
  <circle cx="206" cy="248" r="3" fill="#2a1a2a"/>
  <!-- Stern mouth -->
  <line x1="180" y1="275" x2="220" y2="275" stroke="#2a1a2a" stroke-width="2.5"/>
  <!-- Ears -->
  <ellipse cx="94" cy="210" rx="22" ry="27" fill="#2a1a2a"/>
  <ellipse cx="94" cy="210" rx="13" ry="17" fill="#4a3a4a"/>
  <ellipse cx="306" cy="210" rx="22" ry="27" fill="#2a1a2a"/>
  <ellipse cx="306" cy="210" rx="13" ry="17" fill="#4a3a4a"/>
  <!-- Dark cloak -->
  <path d="M112 315 Q200 340 288 315 L298 400 L102 400 Z" fill="#1a0a1a"/>
  <!-- High collar -->
  <path d="M130 310 Q130 290 145 285" stroke="#2a1a2a" stroke-width="3" fill="none"/>
  <path d="M270 310 Q270 290 255 285" stroke="#2a1a2a" stroke-width="3" fill="none"/>
  <!-- Scar -->
  <line x1="240" y1="230" x2="255" y2="260" stroke="#F44336" stroke-width="1.5" opacity="0.5"/>
  <!-- Head top -->
  <path d="M135 132 Q165 108 200 114 Q235 108 265 132" fill="#2a1a2a"/>
</svg>

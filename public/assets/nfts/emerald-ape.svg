<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a2a"/>
      <stop offset="100%" style="stop-color:#0d2818"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Head -->
  <ellipse cx="200" cy="210" rx="120" ry="130" fill="#8B6F47"/>
  <!-- Face -->
  <ellipse cx="200" cy="230" rx="85" ry="90" fill="#C4A06A"/>
  <!-- Eyes area -->
  <rect x="120" y="175" width="160" height="45" rx="22" fill="#1a1a1a"/>
  <!-- Sunglasses lenses -->
  <ellipse cx="160" cy="197" rx="35" ry="20" fill="#2d5a3d"/>
  <ellipse cx="240" cy="197" rx="35" ry="20" fill="#2d5a3d"/>
  <!-- Sunglasses bridge -->
  <rect x="190" y="192" width="20" height="6" rx="3" fill="#1a1a1a"/>
  <!-- Sunglasses reflection -->
  <ellipse cx="150" cy="192" rx="12" ry="8" fill="#3d7a5d" opacity="0.5"/>
  <ellipse cx="230" cy="192" rx="12" ry="8" fill="#3d7a5d" opacity="0.5"/>
  <!-- Nose -->
  <ellipse cx="200" cy="250" rx="18" ry="12" fill="#A0814E"/>
  <circle cx="192" cy="250" r="4" fill="#7a6038"/>
  <circle cx="208" cy="250" r="4" fill="#7a6038"/>
  <!-- Mouth -->
  <path d="M175 275 Q200 295 225 275" stroke="#7a6038" stroke-width="3" fill="none"/>
  <!-- Ears -->
  <ellipse cx="90" cy="200" rx="25" ry="30" fill="#8B6F47"/>
  <ellipse cx="90" cy="200" rx="15" ry="20" fill="#C4A06A"/>
  <ellipse cx="310" cy="200" rx="25" ry="30" fill="#8B6F47"/>
  <ellipse cx="310" cy="200" rx="15" ry="20" fill="#C4A06A"/>
  <!-- Jacket -->
  <path d="M100 310 Q100 290 130 280 L200 300 L270 280 Q300 290 300 310 L300 400 L100 400 Z" fill="#2d7a4d"/>
  <!-- Jacket lapels -->
  <path d="M150 290 L200 320 L170 340 Z" fill="#1d5a3d"/>
  <path d="M250 290 L200 320 L230 340 Z" fill="#1d5a3d"/>
  <!-- Collar -->
  <rect x="180" y="300" width="40" height="15" rx="5" fill="#f0f0f0"/>
  <!-- Jacket buttons -->
  <circle cx="200" cy="355" r="4" fill="#D4944C"/>
  <circle cx="200" cy="375" r="4" fill="#D4944C"/>
  <!-- Head top fur -->
  <path d="M130 130 Q160 100 200 110 Q240 100 270 130" fill="#8B6F47"/>
</svg>

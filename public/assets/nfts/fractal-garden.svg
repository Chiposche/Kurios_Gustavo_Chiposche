<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a18"/>
      <stop offset="100%" style="stop-color:#0a1a10"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Fractal plants background -->
  <path d="M50 400 Q55 350 70 340 Q60 330 50 340" stroke="#4CAF50" stroke-width="1.5" fill="none" opacity="0.2"/>
  <path d="M70 340 Q80 310 90 300 Q75 295 70 310" stroke="#4CAF50" stroke-width="1.5" fill="none" opacity="0.2"/>
  <path d="M340 400 Q345 360 355 350 Q340 345 335 355" stroke="#66BB6A" stroke-width="1.5" fill="none" opacity="0.2"/>
  <path d="M355 350 Q360 320 370 310 Q355 308 350 320" stroke="#66BB6A" stroke-width="1.5" fill="none" opacity="0.2"/>
  <!-- Flowers -->
  <circle cx="65" cy="335" r="5" fill="#E91E63" opacity="0.25"/>
  <circle cx="350" cy="345" r="5" fill="#FF9800" opacity="0.25"/>
  <circle cx="90" cy="295" r="4" fill="#9C27B0" opacity="0.2"/>
  <!-- Head -->
  <ellipse cx="200" cy="215" rx="116" ry="126" fill="#3a6a2a"/>
  <ellipse cx="200" cy="235" rx="82" ry="86" fill="#A5D6A7"/>
  <!-- Flower crown -->
  <circle cx="155" cy="130" r="10" fill="#E91E63" opacity="0.7"/>
  <circle cx="180" cy="118" r="8" fill="#FF9800" opacity="0.7"/>
  <circle cx="200" cy="115" r="10" fill="#FFEB3B" opacity="0.7"/>
  <circle cx="220" cy="118" r="8" fill="#9C27B0" opacity="0.7"/>
  <circle cx="245" cy="130" r="10" fill="#2196F3" opacity="0.7"/>
  <!-- Leaves between flowers -->
  <ellipse cx="168" cy="125" rx="8" ry="4" fill="#4CAF50" opacity="0.5" transform="rotate(-20 168 125)"/>
  <ellipse cx="210" cy="117" rx="8" ry="4" fill="#4CAF50" opacity="0.5" transform="rotate(10 210 117)"/>
  <ellipse cx="233" cy="125" rx="8" ry="4" fill="#4CAF50" opacity="0.5" transform="rotate(20 233 125)"/>
  <!-- Kind eyes -->
  <ellipse cx="165" cy="205" rx="18" ry="16" fill="white"/>
  <ellipse cx="235" cy="205" rx="18" ry="16" fill="white"/>
  <circle cx="165" cy="207" r="9" fill="#2E7D32"/>
  <circle cx="235" cy="207" r="9" fill="#2E7D32"/>
  <circle cx="162" cy="204" r="4" fill="white"/>
  <circle cx="232" cy="204" r="4" fill="white"/>
  <!-- Nose -->
  <ellipse cx="200" cy="245" rx="13" ry="8" fill="#6a9a4a"/>
  <circle cx="194" cy="245" r="3" fill="#4a7a2a"/>
  <circle cx="206" cy="245" r="3" fill="#4a7a2a"/>
  <!-- Warm smile -->
  <path d="M172 268 Q200 292 228 268" stroke="#4a7a2a" stroke-width="2.5" fill="none"/>
  <!-- Ears -->
  <ellipse cx="94" cy="210" rx="22" ry="27" fill="#3a6a2a"/>
  <ellipse cx="94" cy="210" rx="13" ry="17" fill="#A5D6A7"/>
  <ellipse cx="306" cy="210" rx="22" ry="27" fill="#3a6a2a"/>
  <ellipse cx="306" cy="210" rx="13" ry="17" fill="#A5D6A7"/>
  <!-- Garden overalls -->
  <path d="M112 315 Q200 340 288 315 L298 400 L102 400 Z" fill="#5D4037"/>
  <!-- Overall straps -->
  <line x1="160" y1="310" x2="165" y2="350" stroke="#8D6E63" stroke-width="4"/>
  <line x1="240" y1="310" x2="235" y2="350" stroke="#8D6E63" stroke-width="4"/>
  <!-- Pocket flower -->
  <circle cx="200" cy="370" r="6" fill="#E91E63" opacity="0.5"/>
  <!-- Head top -->
  <path d="M135 132 Q165 108 200 114 Q235 108 265 132" fill="#3a6a2a"/>
</svg>

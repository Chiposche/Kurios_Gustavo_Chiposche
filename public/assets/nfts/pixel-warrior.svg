  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Pixelated grid background -->
  <rect x="40" y="40" width="20" height="20" fill="#2a4a2a" opacity="0.3"/>
  <rect x="80" y="60" width="20" height="20" fill="#2a4a2a" opacity="0.3"/>
  <rect x="300" y="80" width="20" height="20" fill="#2a4a2a" opacity="0.3"/>
  <rect x="340" y="40" width="20" height="20" fill="#2a4a2a" opacity="0.3"/>
  <rect x="60" y="340" width="20" height="20" fill="#2a4a2a" opacity="0.3"/>
  <rect x="320" y="320" width="20" height="20" fill="#2a4a2a" opacity="0.3"/>
  <!-- Head -->
  <ellipse cx="200" cy="215" rx="116" ry="126" fill="#5a8a3a"/>
  <ellipse cx="200" cy="235" rx="82" ry="86" fill="#8BC34A"/>
  <!-- Pixel helmet -->
  <rect x="130" y="110" width="140" height="20" fill="#4CAF50"/>

  <!-- Eyes -->
  <rect x="155" y="190" width="22" height="22" fill="white"/>
  <rect x="223" y="190" width="22" height="22" fill="white"/>
  <rect x="161" y="196" width="12" height="12" fill="#1a1a1a"/>
  <rect x="229" y="196" width="12" height="12" fill="#1a1a1a"/>
  <!-- Nose -->
  <ellipse cx="200" cy="242" rx="14" ry="9" fill="#6a9a4a"/>
  <circle cx="194" cy="242" r="3" fill="#4a7a2a"/>
  <circle cx="206" cy="242" r="3" fill="#4a7a2a"/>
  <!-- Mouth -->
  <path d="M180 268 L190 278 L200 268 L210 278 L220 268" stroke="#4a7a2a" stroke-width="2.5" fill="none"/>
  <!-- Ears -->
  <ellipse cx="94" cy="210" rx="22" ry="27" fill="#5a8a3a"/>

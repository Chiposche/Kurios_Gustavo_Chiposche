  <ellipse cx="306" cy="210" rx="22" ry="27" fill="#5a8a3a"/>
  <ellipse cx="306" cy="210" rx="13" ry="17" fill="#8BC34A"/>
  <!-- Pixel armor -->
  <path d="M112 315 Q200 340 288 315 L298 400 L102 400 Z" fill="#388E3C"/>
  <rect x="170" y="320" width="60" height="10" fill="#00E676" opacity="0.5"/>
  <rect x="180" y="335" width="40" height="10" fill="#00E676" opacity="0.3"/>
  <!-- Sword on back -->
  <rect x="280" y="280" width="6" height="80" fill="#FFD54F" transform="rotate(-20 283 320)"/>
  <rect x="272" y="275" width="22" height="8" rx="2" fill="#8D6E63" transform="rotate(-20 283 279)"/>

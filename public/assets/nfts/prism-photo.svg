  <path d="M112 315 Q200 340 288 315 L298 400 L102 400 Z" fill="#3E2723"/>
  <!-- Turtleneck collar -->
  <path d="M145 310 Q200 318 255 310 Q255 298 200 292 Q145 298 145 310 Z" fill="#4E342E"/>

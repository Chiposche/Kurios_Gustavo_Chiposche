  <line x1="130" y1="315" x2="180" y2="380" stroke="#FFB300" stroke-width="3"/>
  <line x1="270" y1="315" x2="220" y2="380" stroke="#FFB300" stroke-width="3"/>
  <!-- Small camera -->
  <rect x="180" y="365" width="40" height="28" rx="5" fill="#37474F"/>
  <circle cx="200" cy="376" r="8" fill="#263238"/>
  <circle cx="200" cy="376" r="4" fill="#FFB300" opacity="0.3"/>

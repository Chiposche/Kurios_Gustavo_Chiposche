<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a10"/>
      <stop offset="100%" style="stop-color:#1a1a08"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Soft light -->
  <circle cx="200" cy="200" r="180" fill="#FFD54F" opacity="0.03"/>

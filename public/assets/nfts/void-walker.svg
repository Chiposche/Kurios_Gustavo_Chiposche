  <ellipse cx="165" cy="205" rx="18" ry="16" fill="white"/>
  <ellipse cx="235" cy="205" rx="18" ry="16" fill="white"/>
  <circle cx="167" cy="205" r="9" fill="#311B92"/>
  <circle cx="237" cy="205" r="9" fill="#311B92"/>
  <circle cx="164" cy="202" r="4" fill="white"/>
  <circle cx="234" cy="202" r="4" fill="white"/>
  <!-- Nose -->
  <ellipse cx="200" cy="248" rx="14" ry="9" fill="#7a5aBa"/>

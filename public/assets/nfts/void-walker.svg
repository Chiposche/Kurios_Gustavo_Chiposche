  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Void particles -->
  <circle cx="80" cy="100" r="2" fill="#B388FF" opacity="0.3"/>
  <circle cx="320" cy="80" r="1.5" fill="#B388FF" opacity="0.25"/>
  <circle cx="60" cy="300" r="1.5" fill="#7C4DFF" opacity="0.2"/>

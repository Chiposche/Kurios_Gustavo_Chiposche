  <path d="M175 272 Q200 290 225 272" stroke="#5a3a9a" stroke-width="2.5" fill="none"/>
  <!-- Ears -->
  <ellipse cx="94" cy="210" rx="22" ry="27" fill="#3a2a4a"/>
  <ellipse cx="94" cy="210" rx="13" ry="17" fill="#9575CD"/>
  <ellipse cx="306" cy="210" rx="22" ry="27" fill="#3a2a4a"/>
  <ellipse cx="306" cy="210" rx="13" ry="17" fill="#9575CD"/>
  <!-- Explorer coat -->
  <path d="M112 315 Q200 340 288 315 L298 400 L102 400 Z" fill="#311B92"/>

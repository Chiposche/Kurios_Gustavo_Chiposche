  <!-- Void portal -->
  <ellipse cx="200" cy="200" rx="190" ry="190" fill="none" stroke="#7C4DFF" stroke-width="1" opacity="0.06"/>
  <ellipse cx="200" cy="200" rx="170" ry="170" fill="none" stroke="#B388FF" stroke-width="1" opacity="0.08"/>
